<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj Projekt - Kontakt</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/morph/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js"></script>
</head>
<body>


<nav class="navbar navbar-expand-lg bg-dark" data-bs-theme="dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">KlavesniceCZ</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor02">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarColor02">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Domů</a></li>
        <li class="nav-item"><a class="nav-link" href="stranka2.html">Postup</a></li>
        <li class="nav-item"><a class="nav-link active" href="stranka3.html">Kontakt</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">

    
    <section class="mb-5">
        <h2>Kontaktní formulář</h2>
        <form>
            <div class="mb-3">
                <label for="email" class="form-label">Emailová adresa</label>
                <input type="email" class="form-control" id="email" placeholder="jmeno@domain.cz" required>
            </div>
            <div class="mb-3">
                <label for="zprava" class="form-label">Vaše zpráva</label>
                
                <textarea id="zprava" name="zprava" class="form-control" rows="10"></textarea>
            </div>
            <button type="submit" class="btn btn-success">Odeslat zprávu</button>
        </form>
    </section>

</div>


<footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
        <p>&copy; 2026 Můj Projekt. Všechna práva vyhrazena.</p>
        <p><a href="dokumentace.pdf" class="text-info text-decoration-none" target="_blank"><i class="fas fa-file-pdf"></i> Zobrazit dokumentaci (PDF)</a></p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    tinymce.init({
        selector: '#zprava',
        menubar: false,
        plugins: 'lists link',
        toolbar: 'undo redo | bold italic | alignleft aligncenter alignright | bullist numlist | link'
    });
</script>

</body>
</html>
